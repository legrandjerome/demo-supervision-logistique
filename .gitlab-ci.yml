stages:
  - lint
  - test
  - build
  - release
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- API Symfony -----------------------------------------------------------

.api:
  image: dunglas/frankenphp:1-php8.4
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
    DATABASE_URL: "postgresql://app:app@database:5432/app?serverVersion=17&charset=utf8"
  cache:
    key: composer
    paths:
      - .cache/composer/
  before_script:
    - install-php-extensions pdo_pgsql intl zip @composer
    - cd api
    - composer install --prefer-dist --no-progress --no-interaction
  rules:
    - changes:
        - api/**/*
        - .gitlab-ci.yml

api:lint:
  extends: .api
  stage: lint
  script:
    - php bin/console lint:yaml config
    - php bin/console lint:container
    - php bin/console doctrine:schema:validate --skip-sync

api:test:
  extends: .api
  stage: test
  services:
    - name: postgres:17-alpine
      alias: database
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
  script:
    - php bin/console lexik:jwt:generate-keypair --skip-if-exists
    - php bin/console doctrine:database:create --env=test --if-not-exists
    - vendor/bin/phpunit --log-junit phpunit-report.xml
  artifacts:
    when: always
    reports:
      junit: api/phpunit-report.xml

# --- Front Angular ---------------------------------------------------------

.front:
  image: node:22
  cache:
    key:
      files:
        - front/package-lock.json
    paths:
      - front/.npm/
  before_script:
    - cd front
    - npm ci --cache .npm --prefer-offline
  rules:
    - changes:
        - front/**/*
        - .gitlab-ci.yml

front:test:
  extends: .front
  stage: test
  script:
    - npx ng test --watch=false

front:build:
  extends: .front
  stage: build
  script:
    - npx ng build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1 week

# --- Images de production ---------------------------------------------------

# Construit une image et la pousse dans le registre du projet, étiquetée par le commit et « latest ».
.release:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build $BUILD_ARGS --tag "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" --tag "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest" "$BUILD_CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:api:
  extends: .release
  variables:
    IMAGE_NAME: api
    BUILD_CONTEXT: api
    BUILD_ARGS: "--target prod"

release:front:
  extends: .release
  variables:
    IMAGE_NAME: front
    BUILD_CONTEXT: front
    BUILD_ARGS: ""

# --- Déploiement ------------------------------------------------------------

# À lancer à la main depuis GitLab. Variables attendues (Settings > CI/CD > Variables) :
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY (type « File ») et DEPLOY_KNOWN_HOSTS.
deploy:production:
  stage: deploy
  image: alpine:3
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
    url: https://demo-supervision.legrand-jerome.fr
  variables:
    REMOTE: "$DEPLOY_USER@$DEPLOY_HOST"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 "$DEPLOY_SSH_KEY"
  script:
    - scp -i "$DEPLOY_SSH_KEY" compose.prod.yaml "$REMOTE:$DEPLOY_PATH/compose.yaml"
    # Le jeton du job ne sert qu'à récupérer les images : il ne reste pas sur le serveur.
    - echo "$CI_REGISTRY_PASSWORD" | ssh -i "$DEPLOY_SSH_KEY" "$REMOTE" "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - ssh -i "$DEPLOY_SSH_KEY" "$REMOTE" "cd '$DEPLOY_PATH' && export REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG='$CI_COMMIT_SHORT_SHA' && docker compose pull --quiet && docker compose up --detach --remove-orphans && docker image prune --force && docker compose ps"
  after_script:
    - ssh -i "$DEPLOY_SSH_KEY" "$DEPLOY_USER@$DEPLOY_HOST" "docker logout '$CI_REGISTRY'" || true
