services:
  api:
    build: ./api
    environment:
      SERVER_NAME: ":80"
      DATABASE_URL: "postgresql://app:app@database:5432/app?serverVersion=17&charset=utf8"
    volumes:
      - ./api:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
  caddy_data:
  caddy_config:
