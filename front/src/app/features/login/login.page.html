<main class="login">
  <section class="card">
    <h1>Supervision logistique</h1>
    <p class="muted">Démo : entrepôt fictif, données inventées.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />

      @if (store.error(); as error) {
        <p class="error" role="alert">{{ error }}</p>
      }

      <button type="submit" class="primary" [disabled]="store.isLoading()">
        {{ store.isLoading() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>

    <div class="demo">
      <p class="muted">Comptes de démonstration (mot de passe : <code>demo</code>)</p>
      <div class="demo-buttons">
        @for (account of demoAccounts; track account.email) {
          <button type="button" (click)="fill(account.email)">{{ account.label }}</button>
        }
      </div>
    </div>
  </section>
</main>
